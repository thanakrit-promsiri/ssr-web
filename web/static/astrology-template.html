<!-- web/static/astrology-template.html -->
<!-- Template ตารางสมผุสดาวโหราศาสตร์พระเวท (โหลดและเติมค่าโดย astrology.js ผ่าน data-field) -->

<!-- โครงตารางหลัก -->
<template id="astroTableTemplate">
  <div class="bg-slate-950/80 p-4 rounded-xl border border-purple-500/30 space-y-3">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 border-b border-slate-800 pb-3">
      <div>
        <h4 class="font-semibold text-amber-300 text-sm">🕉️ ตารางสมผุสดาวโหราศาสตร์พระเวท (Nirayana Graha Sphuta)</h4>
        <p class="text-[11px] text-slate-400">เกณฑ์คำนวณ: <span data-field="ayanamsaName"></span> Ayanamsa: <span data-field="ayanamsaDeg"></span> | Whole Sign (W)</p>
      </div>
      <span class="self-start sm:self-auto text-[10px] bg-purple-900/50 text-purple-200 border border-purple-500/30 px-2.5 py-1 rounded-lg">
        D-1 Rashi &amp; D-9 Navamsa
      </span>
    </div>

    <!-- ข้อมูลเจ้าชะตาโดยย่อ -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-[11px] bg-slate-900/90 p-2.5 rounded-lg border border-slate-800">
      <div><span class="text-slate-400">วันเวลาเกิด:</span> <span data-field="birthDateText" class="text-slate-200 font-medium"></span></div>
      <div><span class="text-slate-400">สถานที่:</span> <span data-field="locationText" class="text-slate-200 font-medium"></span></div>
      <div><span class="text-slate-400">พิกัด:</span> <span data-field="coordText" class="text-amber-300 font-mono"></span></div>
    </div>

    <!-- ตารางตำแหน่งดาวพระเวท -->
    <div class="overflow-x-auto rounded-xl border border-slate-800">
      <table class="w-full text-left border-collapse text-xs">
        <thead>
          <tr class="bg-purple-950/60 text-purple-200 border-b border-purple-500/20 text-[11px]">
            <th class="py-2.5 px-3 font-semibold whitespace-nowrap">ดาว / ปัจจัย</th>
            <th class="py-2.5 px-3 font-semibold whitespace-nowrap">ราศี (Rashi)</th>
            <th class="py-2.5 px-3 font-semibold whitespace-nowrap">องศา (Degree)</th>
            <th class="py-2.5 px-3 font-semibold whitespace-nowrap">นักษัตรฤกษ์ (บาท)</th>
            <th class="py-2.5 px-3 font-semibold whitespace-nowrap">เจ้าฤกษ์ (Lord)</th>
            <th class="py-2.5 px-3 font-semibold whitespace-nowrap">นวางศ์ (D-9)</th>
            <th class="py-2.5 px-3 font-semibold whitespace-nowrap">ภพ (House)</th>
            <th class="py-2.5 px-3 font-semibold text-center whitespace-nowrap">มาตรฐานดาว</th>
          </tr>
        </thead>
        <tbody data-field="rows" class="divide-y divide-slate-800/60 bg-slate-950/40"></tbody>
      </table>
    </div>

    <!-- สรุปจันทร์เสวยฤกษ์ และวิมโสตรีทศา (Vimshottari Dasha) -->
    <div class="bg-purple-950/30 p-3 rounded-lg border border-purple-500/20 space-y-1.5 text-[11px]">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
        <div>
          <span class="text-amber-300 font-semibold">🌟 จันทร์เสวยฤกษ์:</span>
          <span data-field="moonNakshatraSummary" class="text-slate-200"></span>
        </div>
        <div>
          <span class="text-purple-300 font-semibold">⏳ ทศาคงเหลือแรกเกิด:</span>
          <span data-field="dashaBalanceText" class="text-slate-200"></span>
        </div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-1 pt-1 border-t border-purple-500/10">
        <div>
          <span class="text-emerald-300 font-semibold">🪐 มหาทศาปัจจุบัน:</span>
          <span data-field="mahaText" class="text-slate-200"></span>
        </div>
        <div>
          <span class="text-sky-300 font-semibold">✨ อันตรทศาปัจจุบัน:</span>
          <span data-field="antarText" class="text-slate-200"></span>
        </div>
      </div>
    </div>

    <p class="text-emerald-400 text-xs pt-1">
      ✅ คำนวณสมผุสดาว 27 นักษัตรฤกษ์ นวางศ์ และวิมโสตรีทศาจากระบบ lahiri-api เรียบร้อยแล้ว
    </p>
  </div>
</template>

<!-- แถวดาวแต่ละดวง (คลาสของ <tr> และป้าย dignity ถูกกำหนดเพิ่มจาก JS) -->
<template id="astroRowTemplate">
  <tr>
    <td class="py-2.5 px-3 font-medium text-amber-200 whitespace-nowrap">
      <span data-field="symbol" class="inline-block w-7 text-[10px] font-mono text-purple-300 bg-purple-950/80 border border-purple-500/30 rounded px-1 py-0.5 mr-1.5 text-center"></span>
      <span data-field="nameThai"></span>
      <span data-field="retroBadge" class="hidden ml-1 text-[10px] text-sky-300 font-normal">(พักร์)</span>
      <span data-field="combustBadge" class="hidden ml-1 text-[10px] bg-red-500/20 text-red-300 border border-red-500/30 rounded px-1 py-0.2">ดับ</span>
    </td>
    <td data-field="signThai" class="py-2.5 px-3 text-slate-200 whitespace-nowrap"></td>
    <td data-field="degreeFormatted" class="py-2.5 px-3 font-mono text-amber-300 whitespace-nowrap"></td>
    <td class="py-2.5 px-3 text-slate-200 whitespace-nowrap">
      <span data-field="nakshatraThai"></span>
      <span class="text-[11px] text-purple-300 font-medium ml-1">(บาท <span data-field="pada"></span>)</span>
    </td>
    <td data-field="lordThai" class="py-2.5 px-3 text-slate-300 whitespace-nowrap"></td>
    <td data-field="navamsaThai" class="py-2.5 px-3 text-purple-200 whitespace-nowrap"></td>
    <td data-field="houseThai" class="py-2.5 px-3 text-slate-300 whitespace-nowrap"></td>
    <td class="py-2.5 px-3 text-center whitespace-nowrap">
      <span data-field="dignityThai" class="text-[10px] px-2 py-0.5 rounded-full border"></span>
    </td>
  </tr>
</template>

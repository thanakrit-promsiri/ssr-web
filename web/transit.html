<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทำนายดวงชะตา พ.ศ. 2570 - บูมบามเอไอ พยากรณ์</title>
  <link rel="icon" type="image/png" href="/public/favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js" integrity="sha384-v5YF9xS+gLRWdvrQ0u/WRbCkjSIH0NjHIPe8tBL1ZRrmI7PiSH6LLdzs0aAIMCuh" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    .transit-markdown h1 { font-size: 1.15rem; font-weight: 700; color: #fde68a; margin-top: 1rem; margin-bottom: 0.45rem; }
    .transit-markdown h2 { font-size: 1.05rem; font-weight: 600; color: #fef08a; margin-top: 0.85rem; margin-bottom: 0.4rem; }
    .transit-markdown h3 { font-size: 0.92rem; font-weight: 600; color: #fcd34d; margin-top: 0.75rem; margin-bottom: 0.3rem; }
    .transit-markdown p { margin-bottom: 0.5rem; line-height: 1.6; }
    .transit-markdown ul, .transit-markdown ol { margin-left: 1.25rem; margin-bottom: 0.5rem; }
    .transit-markdown ul { list-style-type: disc; }
    .transit-markdown ol { list-style-type: decimal; }
    .transit-markdown li { margin-bottom: 0.3rem; line-height: 1.55; }
    .transit-markdown strong { color: #fde047; font-weight: 600; }
    .transit-markdown hr { border-color: rgba(168, 85, 247, 0.25); margin: 0.85rem 0; }
  </style>
</head>
<body class="h-screen bg-slate-950 text-slate-100 flex flex-col relative overflow-hidden">

  <!-- Background Glow Effects -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Loading Overlay (แสดงระหว่างตรวจสอบสิทธิ์และข้อมูลครบ 5 รายการ) -->
  <div id="loadingOverlay" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center">
    <div class="w-12 h-12 border-4 border-purple-500/30 border-t-amber-400 rounded-full animate-spin mb-4"></div>
    <p class="text-sm text-slate-400">กำลังตรวจสอบสิทธิ์และข้อมูลพื้นดวงชะตา...</p>
  </div>

  <!-- Top Navbar -->
  <header class="sticky top-0 z-20 border-b border-purple-500/20 bg-slate-900/80 backdrop-blur-xl px-4 md:px-6 py-4 flex items-center justify-between gap-2">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-purple-600 flex items-center justify-center text-xl shadow-md shadow-purple-500/20">
        🌟
      </div>
      <div>
        <h1 class="text-sm md:text-base font-semibold text-amber-200">พยากรณ์ดวงชะตาจร รายเดือน พ.ศ. 2570</h1>
        <p id="userInfo" class="text-xs text-slate-400">ผู้ใช้งาน: กำลังโหลด...</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="/chat.html" class="text-xs bg-purple-950/80 hover:bg-purple-900 border border-purple-500/30 text-purple-200 px-3 py-1.5 rounded-lg transition duration-200">
        ← กลับหน้าดวงกำเนิด
      </a>
      <button type="button" onclick="handleLogout()" class="text-xs bg-slate-800 hover:bg-red-500/20 hover:text-red-300 border border-slate-700 hover:border-red-500/30 text-slate-300 px-3 py-1.5 rounded-lg transition duration-200 cursor-pointer">
        ออกจากระบบ
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main id="transitMain" class="relative z-10 flex-1 overflow-y-auto p-4 md:p-6 max-w-4xl w-full mx-auto flex flex-col gap-4">
    <!-- เนื้อหาหลักและปุ่มทั้ง 12 เดือนจะถูกแทรกจาก transit-template.html โดย transit.js -->
  </main>

  <!-- โหลดสคริปต์แบบป้องกัน Cache -->
  <script>
    (async () => {
      const ts = Date.now();
      const scripts = [
        '/static/auth.js',
        '/static/hora-common.js',
        '/static/transit.js'
      ];

      for (const src of scripts) {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = `${src}?t=${ts}`;
          s.async = false;
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      }

      if (typeof initTransitPage === 'function') {
        initTransitPage();
      }
    })();
  </script>
</body>
</html>

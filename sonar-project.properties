# SonarCloud Configuration for ssr-web
sonar.organization=thanakrit-promsiri
sonar.projectKey=thanakrit-promsiri_ssr-web
sonar.projectName=ssr-web

# Source & Test Directories
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/logs/**,**/*.json,public/**
sonar.coverage.exclusions=cmd/server/main.go,web/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go Test Coverage Report Path
sonar.go.coverage.reportPaths=coverage.out
